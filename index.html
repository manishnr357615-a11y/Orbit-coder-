<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Orbit Coder // AI Development</title>

<style>

/* =====================================================
   ORBIT CODER
   FUTURISTIC CYBERPUNK AI DASHBOARD
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(0,255,247,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 70%,
            rgba(255,0,220,.09),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0,120,255,.08),
            transparent 25%
        ),
        #010306;

    color: #eaffff;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   CYBER GRID
===================================================== */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,255,247,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,247,.045) 1px,
            transparent 1px
        );

    background-size: 34px 34px;

    pointer-events: none;

    z-index: -10;

    animation:
        gridMove 18s linear infinite;
}

@keyframes gridMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 34px;
    }
}


/* =====================================================
   DARK VIGNETTE
===================================================== */

body::after {
    content: "";

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.78) 100%
        );

    pointer-events: none;

    z-index: -9;
}


/* =====================================================
   SCANLINES
===================================================== */

.scanlines {
    position: fixed;

    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 5px
        );

    pointer-events: none;

    z-index: 900;

    opacity: .35;
}


/* =====================================================
   MOVING SCAN BEAM
===================================================== */

.scan-beam {
    position: fixed;

    left: 0;

    top: -10%;

    width: 100%;

    height: 3px;

    background: #00fff7;

    box-shadow:
        0 0 10px #00fff7,
        0 0 30px #00fff7,
        0 0 60px rgba(0,255,247,.8);

    opacity: .2;

    pointer-events: none;

    z-index: 901;

    animation:
        scanBeam 7s linear infinite;
}

@keyframes scanBeam {

    0% {
        top: -5%;
    }

    100% {
        top: 105%;
    }
}


/* =====================================================
   NAVIGATION
===================================================== */

.navbar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 68px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 6%;

    background:
        rgba(1,4,8,.88);

    border-bottom:
        1px solid rgba(0,255,247,.25);

    backdrop-filter: blur(14px);

    z-index: 500;

    box-shadow:
        0 0 30px rgba(0,255,247,.04);
}

.logo {

    position: relative;

    color: #00fff7;

    font-family: monospace;

    font-size: 17px;

    font-weight: bold;

    letter-spacing: 3px;

    text-shadow:
        0 0 8px #00fff7,
        0 0 20px #00fff7;
}

.logo span {

    color: #ff27dc;

    text-shadow:
        0 0 8px #ff27dc,
        0 0 20px #ff27dc;
}


/* NAV HUD */

.nav-right {

    display: flex;

    align-items: center;

    gap: 20px;

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 2px;

    color: #557777;
}

.status {

    display: flex;

    align-items: center;

    color: #00ff88;
}

.status-dot {

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #00ff88;

    box-shadow:
        0 0 8px #00ff88,
        0 0 20px #00ff88;

    animation:
        pulse 1.4s infinite;
}

@keyframes pulse {

    0%,100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .3;
        transform: scale(.65);
    }
}


/* =====================================================
   HERO
===================================================== */

.hero {

    min-height: 100vh;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 110px 20px 80px;

    overflow: hidden;
}


/* =====================================================
   FUTURISTIC ORBITS
===================================================== */

.orbit {

    position: absolute;

    border-radius: 50%;

    pointer-events: none;
}

.orbit-one {

    width: 330px;
    height: 330px;

    border:
        1px solid rgba(0,255,247,.18);

    box-shadow:
        0 0 40px rgba(0,255,247,.04);

    animation:
        rotate 14s linear infinite;
}

.orbit-two {

    width: 520px;
    height: 520px;

    border:
        1px dashed rgba(255,39,220,.13);

    animation:
        reverseRotate 21s linear infinite;
}

.orbit-three {

    width: 720px;
    height: 720px;

    border:
        1px solid rgba(0,255,247,.045);

    animation:
        rotate 32s linear infinite;
}

.orbit-one::before {

    content: "";

    position: absolute;

    top: 8px;
    left: 50%;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #00fff7;

    box-shadow:
        0 0 10px #00fff7,
        0 0 30px #00fff7,
        0 0 60px #00fff7;
}

.orbit-two::before {

    content: "";

    position: absolute;

    right: 12px;
    bottom: 70px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #ff27dc;

    box-shadow:
        0 0 10px #ff27dc,
        0 0 30px #ff27dc;
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes reverseRotate {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


/* =====================================================
   HERO HUD CORNERS
===================================================== */

.hud-corner {

    position: absolute;

    width: 65px;
    height: 65px;

    opacity: .45;
}

.hud-corner::before,
.hud-corner::after {

    content: "";

    position: absolute;

    background: #00fff7;

    box-shadow:
        0 0 8px #00fff7;
}

.hud-corner::before {

    width: 100%;
    height: 1px;
}

.hud-corner::after {

    width: 1px;
    height: 100%;
}

.corner-tl {
    top: 100px;
    left: 5%;
}

.corner-tr {
    top: 100px;
    right: 5%;

    transform: rotate(90deg);
}

.corner-bl {
    bottom: 60px;
    left: 5%;

    transform: rotate(-90deg);
}

.corner-br {
    bottom: 60px;
    right: 5%;

    transform: rotate(180deg);
}


/* =====================================================
   HERO CONTENT
===================================================== */

.hero-content {

    position: relative;

    z-index: 10;

    max-width: 900px;

    animation:
        heroAppear 1.2s ease both;
}

@keyframes heroAppear {

    from {
        opacity: 0;
        transform: translateY(35px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* SYSTEM LABEL */

.system-label {

    display: inline-block;

    padding: 8px 14px;

    color: #00fff7;

    border:
        1px solid rgba(0,255,247,.3);

    background:
        rgba(0,255,247,.025);

    font-family: monospace;

    font-size: 9px;

    letter-spacing: 4px;

    box-shadow:
        0 0 20px rgba(0,255,247,.04);

    animation:
        flicker 4s infinite;
}

@keyframes flicker {

    0%,95%,100% {
        opacity: 1;
    }

    96% {
        opacity: .45;
    }

    97% {
        opacity: 1;
    }
}


/* =====================================================
   MAIN TITLE
===================================================== */

.hero h1 {

    margin-top: 28px;

    font-family: monospace;

    font-size:
        clamp(50px, 14vw, 115px);

    line-height: .88;

    letter-spacing: 5px;

    color: #eaffff;

    text-shadow:
        0 0 6px #00fff7,
        0 0 18px #00fff7,
        0 0 45px rgba(0,255,247,.75);

    animation:
        titlePulse 3s ease-in-out infinite alternate;
}

.hero h1 span {

    color: #00fff7;
}

@keyframes titlePulse {

    from {

        text-shadow:
            0 0 6px #00fff7,
            0 0 18px #00fff7;

    }

    to {

        text-shadow:
            0 0 8px #00fff7,
            0 0 28px #00fff7,
            0 0 60px rgba(0,255,247,.8);

    }
}


/* =====================================================
   SLOGAN
===================================================== */

.slogan {

    margin-top: 28px;

    color: #ff27dc;

    font-family: monospace;

    font-size:
        clamp(16px, 4vw, 26px);

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 0 8px #ff27dc,
        0 0 25px rgba(255,39,220,.6);
}


/* =====================================================
   DESCRIPTION
===================================================== */

.hero-description {

    max-width: 650px;

    margin:
        24px auto 0;

    color: #698787;

    font-family: monospace;

    font-size: 12px;

    line-height: 1.9;

    letter-spacing: .5px;
}


/* =====================================================
   START BUTTON
===================================================== */

.start-button {

    position: relative;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 245px;

    margin-top: 40px;

    padding: 18px 30px;

    color: #020509;

    background: #00fff7;

    border:
        1px solid #00fff7;

    text-decoration: none;

    font-family: monospace;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 2px;

    overflow: hidden;

    box-shadow:
        0 0 15px #00fff7,
        0 0 35px rgba(0,255,247,.4),
        0 0 80px rgba(0,255,247,.12);

    transition:
        transform .25s,
        box-shadow .25s;
}

.start-button::before {

    content: "";

    position: absolute;

    top: 0;

    left: -120%;

    width: 80%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    transform: skewX(-25deg);

    transition:
        left .6s;
}

.start-button:hover::before {

    left: 130%;
}

.start-button:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 0 25px #00fff7,
        0 0 60px rgba(0,255,247,.55),
        0 0 100px rgba(0,255,247,.2);
}

.start-button:active {

    transform:
        scale(.96);
}


/* =====================================================
   SCROLL INDICATOR
===================================================== */

.scroll-indicator {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    color: #385555;

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 3px;

    animation:
        scrollPulse 2s infinite;
}

@keyframes scrollPulse {

    50% {
        opacity: .3;
        transform:
            translate(-50%,5px);
    }
}


/* =====================================================
   SECTION
===================================================== */

.section {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding:
        110px 25px;
}


/* =====================================================
   SECTION HEADING
===================================================== */

.section-tag {

    color: #ff27dc;

    font-family: monospace;

    font-size: 9px;

    letter-spacing: 4px;

    margin-bottom: 15px;

    text-shadow:
        0 0 10px #ff27dc;
}

.section h2 {

    color: #eaffff;

    font-family: monospace;

    font-size:
        clamp(30px, 7vw, 52px);

    letter-spacing: 2px;

    line-height: 1.1;

    margin-bottom: 25px;
}

.section h2 span {

    color: #00fff7;

    text-shadow:
        0 0 12px #00fff7,
        0 0 30px rgba(0,255,247,.45);
}

.description {

    max-width: 800px;

    color: #718c8c;

    font-size: 14px;

    line-height: 1.9;
}


/* =====================================================
   INTRO PANEL
===================================================== */

.intro-panel {

    position: relative;

    margin-top: 45px;

    padding: 35px;

    background:
        linear-gradient(
            135deg,
            rgba(0,255,247,.055),
            rgba(255,39,220,.025)
        );

    border:
        1px solid rgba(0,255,247,.22);

    border-left:
        3px solid #00fff7;

    box-shadow:
        inset 0 0 40px rgba(0,255,247,.025),
        0 0 30px rgba(0,255,247,.04);

    overflow: hidden;
}

.intro-panel::before {

    content: "ORBIT // AI CORE";

    position: absolute;

    top: 10px;

    right: 15px;

    color: rgba(0,255,247,.3);

    font-family: monospace;

    font-size: 7px;

    letter-spacing: 2px;
}

.intro-panel p {

    color: #789393;

    font-size: 14px;

    line-height: 1.9;
}


/* =====================================================
   FEATURE CARDS
===================================================== */

.cards {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 20px;

    margin-top: 45px;
}

.card {

    position: relative;

    min-height: 230px;

    padding: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(0,255,247,.045),
            rgba(0,0,0,.4)
        );

    border:
        1px solid rgba(0,255,247,.16);

    overflow: hidden;

    transition:
        transform .35s,
        border-color .35s,
        box-shadow .35s;
}

.card::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 70px;
    height: 2px;

    background: #00fff7;

    box-shadow:
        0 0 12px #00fff7;
}

.card::after {

    content: "";

    position: absolute;

    right: -60px;
    bottom: -60px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(255,39,220,.06);

    filter: blur(15px);
}

.card:hover {

    transform:
        translateY(-9px);

    border-color:
        rgba(0,255,247,.65);

    box-shadow:
        0 0 30px rgba(0,255,247,.1);
}

.card-icon {

    color: #00fff7;

    font-family: monospace;

    font-size: 29px;

    margin-bottom: 22px;

    text-shadow:
        0 0 12px #00fff7;
}

.card:nth-child(2) .card-icon {

    color: #ff27dc;

    text-shadow:
        0 0 12px #ff27dc;
}

.card:nth-child(3) .card-icon {

    color: #00ff88;

    text-shadow:
        0 0 12px #00ff88;
}

.card h3 {

    color: #e7ffff;

    font-family: monospace;

    font-size: 14px;

    letter-spacing: 1px;

    margin-bottom: 14px;
}

.card p {

    color: #668282;

    font-size: 12px;

    line-height: 1.8;
}


/* =====================================================
   HOW TO USE
===================================================== */

.steps {

    display: grid;

    gap: 16px;

    margin-top: 50px;
}

.step {

    position: relative;

    display: flex;

    align-items: flex-start;

    gap: 20px;

    padding: 25px;

    background:
        linear-gradient(
            90deg,
            rgba(0,255,247,.055),
            rgba(0,255,247,.012)
        );

    border:
        1px solid rgba(0,255,247,.14);

    border-left:
        3px solid #00fff7;

    transition:
        transform .3s,
        border-color .3s,
        background .3s;
}

.step:hover {

    transform:
        translateX(8px);

    background:
        rgba(0,255,247,.075);

    border-color:
        rgba(0,255,247,.55);

    box-shadow:
        0 0 25px rgba(0,255,247,.06);
}

.step-number {

    flex-shrink: 0;

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #00fff7;

    border:
        1px solid #00fff7;

    font-family: monospace;

    font-size: 12px;

    font-weight: bold;

    box-shadow:
        0 0 15px rgba(0,255,247,.12);
}

.step h3 {

    color: #eaffff;

    font-family: monospace;

    font-size: 14px;

    letter-spacing: 1px;

    margin-bottom: 8px;
}

.step p {

    color: #6c8989;

    font-size: 12px;

    line-height: 1.8;
}


/* =====================================================
   TERMINAL
===================================================== */

.terminal {

    margin-top: 60px;

    background:
        rgba(0,0,0,.75);

    border:
        1px solid rgba(0,255,247,.3);

    box-shadow:
        0 0 35px rgba(0,255,247,.06);
}

.terminal-header {

    height: 40px;

    display: flex;

    align-items: center;

    padding: 0 14px;

    border-bottom:
        1px solid rgba(0,255,247,.15);

    color: #527171;

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 2px;
}

.dots {

    display: flex;

    gap: 5px;

    margin-right: 12px;
}

.dots span {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #294646;
}

.terminal-body {

    padding: 25px;

    color: #668585;

    font-family: monospace;

    font-size: 12px;

    line-height: 2;
}

.cyan {

    color: #00fff7;

    text-shadow:
        0 0 8px #00fff7;
}

.pink {

    color: #ff27dc;

    text-shadow:
        0 0 8px #ff27dc;
}

.green {

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}

.cursor {

    display: inline-block;

    width: 7px;
    height: 14px;

    margin-left: 4px;

    vertical-align: middle;

    background: #00fff7;

    box-shadow:
        0 0 8px #00fff7;

    animation:
        blink 1s infinite;
}

@keyframes blink {

    50% {
        opacity: 0;
    }
}


/* =====================================================
   FINAL CTA
===================================================== */

.final {

    position: relative;

    text-align: center;

    padding:
        120px 20px;
}

.final h2 {

    color: #00fff7;

    font-family: monospace;

    font-size:
        clamp(30px,8vw,58px);

    text-shadow:
        0 0 12px #00fff7,
        0 0 35px rgba(0,255,247,.5);
}

.final p {

    max-width: 600px;

    margin:
        20px auto;

    color: #648080;

    font-size: 12px;

    line-height: 1.8;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    padding:
        35px 20px;

    text-align: center;

    border-top:
        1px solid rgba(0,255,247,.12);

    color: #355252;

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 2px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:750px) {

    .navbar {

        height: 60px;

        padding:
            0 18px;
    }

    .logo {

        font-size: 13px;

        letter-spacing: 2px;
    }

    .nav-right {

        gap: 8px;

        font-size: 7px;
    }

    .hero {

        min-height: 100vh;

        padding:
            90px 18px 70px;
    }

    .orbit-one {

        width: 260px;
        height: 260px;
    }

    .orbit-two {

        width: 400px;
        height: 400px;
    }

    .orbit-three {

        width: 550px;
        height: 550px;
    }

    .hero h1 {

        font-size:
            clamp(42px,15vw,75px);

        letter-spacing: 3p
